name: Проверка карточки в браузере
on:
  push:
    branches: [qa/browser-card]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - run: npm test && npm run build
      - name: Проверить свежую сборку
        run: |
          npm exec -- vite preview --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          REPORT_DIR=browser-report/local node tests/browser-card.mjs
      - name: Проверить опубликованный сайт
        run: SITE_URL=https://numbnessq.github.io/football-card-lab/ REPORT_DIR=browser-report/pages node tests/browser-card.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-card
          path: browser-report
